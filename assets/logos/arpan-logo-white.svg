<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 345 54" width="100%" height="100%">
  <defs>
    <linearGradient id="arpanRedGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b30"/>
      <stop offset="50%" stop-color="#cd0a1b"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#cd0a1b" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- High-End Hexagonal Transformer Shield Icon -->
  <g transform="translate(2, 1)">
    <!-- Hexagon Outer -->
    <polygon points="26,2 49,15 49,37 26,50 3,37 3,15" stroke="url(#arpanRedGold)" stroke-width="2.6" fill="#181616"/>
    <!-- Transformer Interlocking Coil Rings -->
    <circle cx="21" cy="26" r="10" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="3 2" fill="none" opacity="0.5"/>
    <circle cx="31" cy="26" r="10" stroke="url(#boltGrad)" stroke-width="1.8" stroke-dasharray="3 2" fill="none" opacity="0.8"/>
    <!-- Central Lightning Flash -->
    <polygon points="28,6 18,26 26,26 24,45 35,23 27,23" fill="url(#boltGrad)" filter="url(#glow)"/>
  </g>

  <!-- Typography: Pure single-flow tspan ensures 0% chance of text collision across all devices -->
  <g>
    <!-- Brand Primary Title -->
    <text x="60" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="28" letter-spacing="1">
      <tspan fill="#ffffff">ARPAN </tspan><tspan fill="#f59e0b">ELECTRICALS</tspan>
    </text>
    
    <!-- Subtitle Line -->
    <text x="61" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="11" letter-spacing="2.4" fill="#a1a1aa">
      &amp; ENTERPRISES &#8226; ESTD. 2002
    </text>
  </g>
</svg>